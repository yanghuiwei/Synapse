name: 功能请求
description: 提出一个新功能或改进想法
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先说问题，不要直接跳到方案 —— 往往有更贴合现状的解法。
      placeholder: |
        例如：目前每次导入 HAR 都要手动整理一遍，而浏览器每天都会导出新的。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过但放弃的其他做法
      description: 写下你否决的方案及理由，能省下后面重复讨论的时间。

  - type: textarea
    id: scope
    attributes:
      label: 涉及范围
      description: |
        这个改动会碰到哪些部分？例如：数据模型迁移、MCP 接口形状、CLI 命令、界面。
        数据模型变更需要更谨慎的讨论——迁移不可逆，且会波及用户已有的库。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有 Issue，没有相同的功能请求
        - label: 这不是一个破坏性变更（如果是，请在「涉及范围」里说明）
