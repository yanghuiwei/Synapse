version: 2

# 刚公开时 dependabot 一口气开了 13 个 PR（连 checkout 4→7、tauri-action 0→1
# 这种跨大版本都提），访客点进 PR 页全是依赖升级，观感很差；而 major 跳跃
# 一旦合并很可能直接打崩构建。所以统一两条约束：
#   1) open-pull-requests-limit 压到 2 —— 每个生态同时最多两个待处理；
#   2) 忽略 semver-major —— 大版本升级由人主动发起，不让机器推着走。
updates:
  # Rust 依赖。workspace 根在 src-tauri/，所以 directory 指向这里而不是仓库根。
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      # release-please 只认 conventional commits；不写前缀会生成一条
      # 无法归类的提交，CHANGELOG 里会缺一块。
      prefix: fix
      include: scope
    groups:
      # tauri 全家桶必须同版本，拆成 5 个 PR 会各自构建失败。
      tauri:
        patterns:
          - "tauri*"
      # 其余次要升级合一个 PR，减少噪音；主版本仍然单独开。
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: fix
      include: scope
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # workflow 里用的是 actions/checkout@v4 这类可变 tag，靠它帮忙盯安全公告。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # actions 的 major 往往是 breaking（inputs 改名、runtime 升级），必须人工确认，
    # 尤其 tauri-action 这种直接决定产物的。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: fix
      include: scope
