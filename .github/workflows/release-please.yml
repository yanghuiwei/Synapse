# 发版编排流水线：合并 PR 到 main → 维护「release vX.Y.Z」PR → 合并后自动 push tag
#
# ══════════════════════════════════════════════════════════════════════════════
# 与已有的 publish.yml 的分工
#   release-please.yml （本文件）—— 只负责**版本号和 tag**：
#     1) 每次 push main，扫描自上一版以来的 conventional commits
#     2) 开/更新一个常驻 PR「chore: release vX.Y.Z」，里面同步 6 处版本号 + CHANGELOG
#     3) 一旦这个 PR 被合并，自动 push 对应的 git tag
#   publish.yml        —— 只负责**构建和发布**：
#     监听 tag push，跑三平台 tauri-action，出 Draft Release
#   两个 workflow 用 tag 作为接力棒，各干各的。
#
# ══════════════════════════════════════════════════════════════════════════════
# ⚠️ token 的选择（决定这个流程能不能自动接力）
#   用 secrets.GITHUB_TOKEN：release-please 能开 PR，但它 push 出来的 tag
#     **不会**触发 publish.yml —— GitHub 有防递归规则，同一个 workflow run 里
#     由 GITHUB_TOKEN 产生的事件不再启动别的 workflow。症状是：tag 推上去了，
#     Release 页面却始终没有 Draft。
#   用 secrets.RELEASE_PLEASE_TOKEN（fine-grained PAT）：走用户身份 push，
#     tag 事件正常触发 publish.yml。这是官方文档明确推荐的做法。
#   PAT 权限最小集：
#     - Repository access: 只选 yanghuiwei/Synapse
#     - Contents:         Read and write
#     - Pull requests:    Read and write
#     - Metadata:         Read（自动带）
#   到期前记得续，或改用 release-please GitHub App（无需管过期）。
# ══════════════════════════════════════════════════════════════════════════════

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# main 上短时间内连推几次，只跑最新一次：release PR 的状态是幂等重算的，
# 老的 run 继续跑只会浪费分钟数、还可能把 tag 打乱。
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# ══════════════════════════════════════════════════════════════════════════════
# 🔴🔴 本仓库踩过的 release-please 死锁（2026-10-13 才解开，附在文件头免得重蹈）
#
# 症状：workflow 显示 `success`，日志里却有
#     ⚠ There are untagged, merged release PRs outstanding - aborting
# 于是**永远不开新的版本 PR**。2026-09-24 起连续 4 次 push main，
# 连带把 `publish.yml` 也一起卡死（它的 `if` 要求 commits 里含 release commit）。
#
# 🔴 **根因不是 tag 缺失，而是 `autorelease: pending` 这个标签没翻掉。**
# release-please 的状态机全在这对标签上：
#     release PR 合并 → 打上 `autorelease: pending`
#     流程跑完打 tag/release → 翻成 `autorelease: tagged`
# 只要有任何一个合并过的 release PR 还停在 `pending`，
# **release-please 就会 abort，连带卡住之后所有的版本 PR**。
#
# 本仓库为什么会卡住：`release-please-config.json` 里
#     "draft": true  +  "skip-github-release": true
# 这两个组合起来，release-please **自己不会去建 tag**，所以那个
# `pending` → `tagged` 的翻转永远不会发生 ⇒ 死锁。
# （社区已知问题，见 googleapis/release-please-action#1205：
#   `include-component-in-tag: false` + `skip-github-release: true` 同类组合会卡住。）
#
# ✅ **解法**：给 release PR 补上那个翻转。本仓库用
#     `scripts/fix-autorelease-label.py`（把 `autorelease: pending`
#      换成 `autorelease: tagged`）一次性修复了 PR #12。
#     今后每发一版，合并 release PR 后要么跑那个脚本，要么在网页上改标签。
#
# ⚠️ **排查这类问题的正确姿势**（我为此绕了大弯）：
#     看 **PR 的标签**，别只看 tag 在不在。
#     `GET /repos/<owner>/<repo>/pulls/<n>` → 看 labels 数组里有没有 `autorelease: pending`。
#     有它 ⇒ 就是这个死锁，与 tag / draft / immutable 都无关。
