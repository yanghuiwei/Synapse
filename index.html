<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      桌面端里这个引号是摆设：Tauri 的窗口标题来自 tauri.conf.json 的 app.windows[].title，
      这里的 <title> 只在 `pnpm dev` 用浏览器直接看页面时才可见。
      两处写同一个品牌名，改的时候一起改。
    -->
    <meta name="description" content="Synapse — 本地优先的 Agent 原生 API 工作台" />
    <meta name="color-scheme" content="light dark" />
    <title>Synapse</title>

    <!--
      防白闪：必须在任何样式表之前同步执行。
      读 localStorage 里的主题，立刻把 .dark 打到 <html> 上。
      下面的 <style> 是「关键背景色」——在 theme.css 加载完成前顶一下，
      避免 dev 模式下（CSS 由 JS 注入）出现一帧白底。
      ⚠️ 这两个色值必须与 theme.css 的 --canvas 保持一致，改那边记得改这里。
      内联而非外链：外链会多一次请求，白闪就回来了。

      ⚠️ `reqly.accent` 与 `reqly.theme` 是**两个键**（正交维度），
      都要在这里读。漏读 accent 的后果不是报错而是「闪一下默认色再变回来」——
      深色尤其明显（默认靛青深色底 #121821，配色下可能是 #1f1613）。
      这段脚本必须与 src/lib/theme.ts 的 applyTheme 保持同一套键名。
    -->
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #121821;
      }
    </style>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("reqly.theme") || "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.style.colorScheme = resolved;
          root.dataset.themeMode = mode;

          // 配色。五个合法值逐个白名单校验 —— 不能把读到的原样塞进
          // data-accent：非法值不匹配任何 CSS 块，界面静默退回默认色，
          // 而这个「退回」发生在防白闪阶段，正好把该显示的颜色吃掉。
          var accent = localStorage.getItem("reqly.accent");
          if (
            accent === "indigo" ||
            accent === "azure" ||
            accent === "violet" ||
            accent === "clay" ||
            accent === "teal"
          ) {
            root.dataset.accent = accent;
          } else {
            root.dataset.accent = "indigo";
          }
        } catch (e) {
          /* localStorage 被禁用等极端情况：保持默认亮色，不阻塞渲染 */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
