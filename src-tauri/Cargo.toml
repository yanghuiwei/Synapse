[package]
name = "reqly"
version = "0.5.0" # x-release-please-version
description = "Synapse — 本地优先的 Agent 原生 API 工作台"
authors = ["yhweix"]
edition = "2021"
# 有两个 bin 目标（桌面端 `reqly` + `bin/reqly-mcp.rs`）之后，`cargo run` 就不再有唯一解。
# Tauri CLI 拉起 dev 时执行的正是 `cargo run --no-default-features`（不带 `--bin`），
# 少了这行会直接报 `could not determine which binary to run` —— 而两个 bin 都是要长期存在的，
# 所以必须在这里钉一个默认值，而不是把 `mcp` 那个从自动发现里摘出去。
default-run = "reqly"

# --- workspace ---
# 这个 package 同时是 workspace 的根。四个 package 的分工：
#   reqly      （本文件）桌面端：tauri + 命令层
#   core/     reqly-core  三个入口共用的核心层（**不含 tauri**）
#   mcp/      reqly-mcp   MCP Server 的 lib + bin（**不含 tauri**）
#   cli/      reqly-cli   命令行入口（**不含 tauri**，但带 clap）
#
# 拆的原因：`reqly-mcp.exe` 只读写一个 SQLite 文件，却因为 bin target 挂在桌面
# package 下而一路链上 tauri —— 21.5 MB。CLI 会是同一个下场，只会更重。
# 顺带的好处：每个入口各挑各的依赖，clap 只进 CLI 那个二进制。
#
# ⚠️ `[profile.release]` 必须留在 workspace 根（也就是本文件）：放进成员 crate
# 会被 Cargo 忽略并给出警告，而这里的 lto/strip 正是体积优化的主力。
[workspace]
members = ["core", "mcp", "cli"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reqly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心层（错误码 / 存储 / HTTP 执行 / 模板 / 压测 / 导入器）。
# 三个入口（桌面 / MCP / CLI）唯一共享的东西，**不含 tauri**。
reqly-core = { path = "core" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 选文件 / 另存为。**只在 Rust 侧用**（`commands/file.rs`）——
# 后端调插件不受 capability 约束，所以不必装 JS 包、也不必在
# `capabilities/default.json` 里开权限，少一层「权限没配、运行时静默失败」。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "time",
] }
tokio-util = { version = "0.7.19", default-features = false }
# reqwest 必须关掉 default features：默认会拉 native-tls(OpenSSL)，那是"要求系统装 OpenSSL"的老路。
# 用 rustls + **系统根证书**（native-roots）而不是 webpki-roots：
# 企业内网常见「用公司根证书做中间人代理」的网关，webpki 的内置 CA 清单里没有它，
# 会直接握手失败；走系统证书库才能正常访问内网网关。
# 版本跟 design.md 保持一致走 0.12（最新 0.12.28）；0.13.5 已发布，
# 但升级要重验代理/证书那几处行为，等 P8 打磨阶段再单独做。
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls-native-roots",
  "gzip",
  "brotli",
  "deflate",
  "http2",
  "charset",
  "json",
  "socks",
  "cookies",
  "multipart",
  "stream",
] }


# --- MCP Server（P7）---
# 已经不在这里了：P8 把它拆成了独立的 `reqly-mcp` package（见 workspace members）。
# 原因就是本文件顶部写的那条 —— bin target 挂在哪个 package 下，就会链上那个
# package 的全部依赖，包括 tauri。桌面端现在与 MCP 协议库（rmcp / axum）无关。


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
