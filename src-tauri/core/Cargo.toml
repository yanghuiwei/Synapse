[package]
name = "reqly-core"
version = "0.2.0" # x-release-please-version
edition = "2021"
description = "Reqly 的核心层：存储 / HTTP 执行 / 模板 / 压测 / 导入器（不含 Tauri）"
# 刻意不写 authors / license：那是对外发布的元数据，归桌面 package。

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DTO 的 JSON Schema 派生。**版本必须与 rmcp 对齐**（rmcp 3.3.0 依赖 schemars 1.2.2）——
# 版本不同就是两个不同的 `JsonSchema` trait，MCP 侧的 `Parameters<T>` 立刻编不过。
# 这是 core 里唯一的「协议相关」依赖，换来的是 13 个操作的出入参只定义一份。
schemars = { version = "1.2", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
thiserror = "2.0.20"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 比桌面端少一个 `net` 特性：那个只有 MCP 的回环 HTTP 通道要自己监听端口，
# 而这里没有需要 bind 的东西 —— core 只做「连接池 / 执行 / 压测」三件事。
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
# `url` 本来就是 reqwest 的依赖（`reqwest::Url` 就是它），这里只是把它提成直接依赖。
# 用到的只有 `form_urlencoded::parse` —— 解析 multipart 回退路径上的 `k=v&k=@file`。
# 自己写一份百分号解码看着简单，但 `+` ↔ 空格、多字节 UTF-8 这两处细节
# 正是「看起来能用、遇到中文就错」的那类地方。
url = "2"

# reqwest 必须关掉 default features：默认会拉 native-tls(OpenSSL)，那是"要求系统装 OpenSSL"的老路。
# 用 rustls + **系统根证书**（native-roots）而不是 webpki-roots：
# 企业内网常见「用公司根证书做中间人代理」的网关，webpki 的内置 CA 清单里没有它，
# 会直接握手失败；走系统证书库才能正常访问内网网关。
# 版本跟 design.md 保持一致走 0.12（最新 0.12.28）；0.13.5 已发布，
# 但升级要重验代理/证书那几处行为，等 P8 打磨阶段再单独做。
reqwest = { version = "0.12.28", default-features = false, features = [
  "rustls-tls-native-roots",
  "gzip",
  "brotli",
  "deflate",
  "http2",
  "charset",
  "json",
  "socks",
  "cookies",
  "multipart",
  "stream",
] }
