<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Synapse">
  <title>Synapse</title>
  <desc>断裂传递：两段对置的半圆弧构成 S，断口处悬浮一颗脉冲，形如突触间隙中的信号跳跃。</desc>
  <defs>
    <linearGradient id="syn-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#syn-bg)"/>

  <!-- 上半弧：右上 → 顶部 → 左侧 → 止于中央偏左下 -->
  <path d="M331 135 A106 100 0 1 0 229 303"
        fill="none" stroke="#22d3ee" stroke-width="36" stroke-linecap="round"/>

  <!-- 下半弧：中央偏右上 → 右侧 → 底部 → 止于左下 -->
  <path d="M331 235 A106 100 0 1 1 154 332"
        fill="none" stroke="#a78bfa" stroke-width="36" stroke-linecap="round"/>

  <!-- 悬浮脉冲：跨越间隙，不与任何一端接触 -->
  <circle cx="256" cy="256" r="30" fill="#ffffff"/>
</svg>
